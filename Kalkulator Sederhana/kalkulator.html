<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studi Kasus</title>
    <link rel="stylesheet" href="kalkulator.css">
</head>
<body>
    <div class="calculator">
        <h2>Kalkulator Sederhana</h2>
        <input type="number" id="angka1" placeholder="Angka Pertama">
        <input type="number" id="angka2" placeholder="Angka Kedua">
        <div class="buttons">
            <button onclick="hitung('+')">+</button>
            <button onclick="hitung('-')">-</button>
            <button onclick="hitung('*')">*</button>
            <button onclick="hitung('/')">/</button>
        </div>
        <h3 id="hasil">Hasil: -</h3>
    </div>
    <script src="kalulator.js"></script>
</body>
</html>
